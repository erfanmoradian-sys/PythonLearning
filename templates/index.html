<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Analyzer</title>
</head>

<body>

    <h1>Text Analyzer</h1>

    <a href="{{ url_for('enter_text') }}">
        <button type="button">Enter Text</button>
    </a>

    <a href="{{ url_for('upload_file') }}">
        <button type="button">Upload File</button>
    </a>

    <a href="{{ url_for('history') }}">
        <button type="button">Show History</button>
    </a>

    <br><br>
    {% if current_user.is_authenticated %}
        <h1>{{ current_user.username }}</h1>
        <p class="bottom"><a href="{{ url_for('logout') }}">Logout</a></p>
    {% else %}
        <p class="bottom"><a href="{{ url_for('login') }}">Login</a></p>
        <p class="bottom"><a href="{{ url_for('register') }}">register</a></p>
    {% endif %}
</body>
</html>
